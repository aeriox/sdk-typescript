workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    aeriox-api:
        inputs:
            - location: https://api.aeriox.co/openapi.json
        registry:
            location: registry.speakeasyapi.dev/aeriox/aeriox/aeriox-api
targets:
    aeriox-typescript:
        target: typescript
        source: aeriox-api
        publish:
            npm:
                token: $npm_token
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/aeriox/aeriox/aeriox-api-typescript-code-samples
            labelOverride:
                fixedValue: Typescript (SDK)
            blocking: false
