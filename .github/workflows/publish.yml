name: Publish to npm
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # Required for npm Trusted Publishing OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    # Phase 4 cross-cutting security review (Finding 5, MEDIUM):
    # gate npm publish behind a GitHub Environment so a tag push
    # alone cannot ship a release. The Environment `npm-publish`
    # must be configured in Settings -> Environments with at least
    # one Required reviewer; the workflow will pause on the
    # reviewer-approval gate before any `npm publish` step runs.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish --access public --provenance
